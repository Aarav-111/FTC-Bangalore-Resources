<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d3a"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <!-- simple robot -->
  <g transform="translate(890,60)" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linejoin="round">
    <rect x="20" y="60" width="160" height="110" rx="14"/>
    <rect x="55" y="10" width="90" height="50" rx="10"/>
    <circle cx="80" cy="35" r="8" fill="#f59e0b"/>
    <circle cx="120" cy="35" r="8" fill="#f59e0b"/>
    <circle cx="55" cy="190" r="22"/>
    <circle cx="145" cy="190" r="22"/>
    <path d="M180 100 L230 80 L250 95"/>
    <circle cx="262" cy="98" r="10" fill="#f59e0b"/>
  </g>
  <!-- AprilTag style square -->
  <g transform="translate(60,215)">
    <rect width="56" height="56" fill="#ffffff"/>
    <rect x="8" y="8" width="40" height="40" fill="#111"/>
    <rect x="16" y="16" width="10" height="10" fill="#fff"/>
    <rect x="30" y="26" width="10" height="10" fill="#fff"/>
    <rect x="16" y="32" width="8" height="8" fill="#fff"/>
  </g>
  <text x="60" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">FTC Bangalore Resources</text>
  <text x="60" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#d1fae5">Open resources for every FTC team in India</text>
  <text x="135" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#fcd34d">FTC 2027 Challenge  |  Chassis  |  Shooter  |  AprilTag Vision</text>
</svg>
